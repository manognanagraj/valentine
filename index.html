<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <title>Will You Be My Valentine?</title>

  <style>
    body {
      margin: 0;
      font-family: 'Pacifico', cursive;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 25px;
      border-radius: 20px;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 22px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.2s;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .no {
      background-color: white;
      color: #ff4d6d;
    }

    button:hover {
      transform: scale(1.1);
    }

    .heart {
      font-size: 2rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    #photoOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: 999;
}

#photoOverlay .content {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.55);
  color: white;
  text-align: center;
  padding: 20px;
}

  </style>
</head>

<body>
 <div id="mainCard" class="card">
    <div class="heart">❤️</div>
    <h1>Hey Love 🥰</h1>
    <p>
      Every moment with you means the world to me.  
      So I wanted to ask you something special…
    </p>
    <h2>Will you be my Valentine? 💌</h2>

    <button class="yes" onclick="yesClicked()">YES 💖</button>
    <button class="no" onclick="noClicked()">NO 🙈</button>
  </div>

  <!-- Hidden overlay -->
  <div id="photoOverlay"></div>

  <script>
function yesClicked() {
  const overlay = document.getElementById("photoOverlay");

  overlay.style.backgroundImage = "url('us.jpg.jpeg')"; // EXACT name
  overlay.style.display = "block";

  overlay.innerHTML = `
    <div class="content">
      <h1 style="font-size:2.5rem;">YAYYY!!! 💕🥹</h1>
      <p style="font-size:1.3rem;">You just made me the happiest person ever!! My cutuu baby I love you soo much baby 💖</p>
      <p style="font-size:1.2rem;">Happy Valentine’s, my love!! MUAAHH ❤️</p>
    </div>
  `;
}

    }

    function noClicked() {
      alert("No is not an option 😤💔 Try again!");
    }
  </script>
</body>
</html>
